name: build-auk-runpod-base
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the CPU audio test tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Speech instruction and inference isolation tests
        run: |
          python3 -m pip install "numpy>=1.26,<3" "soundfile>=0.12,<1"
          python3 -c "import shutil; assert shutil.which('ffmpeg'), 'Real PCM checks require FFmpeg'"
          python3 -m unittest test_auk_contract.py test_auk_inference.py test_auk_handler.py
      - name: Free image build space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.auk-runpod
          push: true
          tags: ghcr.io/kademurdock/scenema-audio-runpod:auk-runpod-${{ github.sha }}
          cache-to: type=inline
          cache-from: type=registry,ref=ghcr.io/kademurdock/scenema-audio-runpod:auk-runpod-a9f8684254f1cc9a80e11fb088b0d06a48f4c053
