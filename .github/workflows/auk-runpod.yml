name: build-auk-runpod-base
on:
  workflow_dispatch:
  push:
    branches: [claude/auk-edit-20261114]
    paths: ['auk_*.py', 'test_auk_*.py', 'check_auk_audio.py', 'Dockerfile.auk-runpod', '.github/workflows/auk-runpod.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install the CPU audio test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install "numpy>=1.26,<3" "soundfile>=0.12,<1"
      - name: Contract, word edit, inference isolation and PCM tests (no GPU)
        run: |
          python3 -c "import shutil; assert shutil.which('ffmpeg'), 'Real PCM checks require FFmpeg'"
          python3 -m unittest -v test_auk_contract.py test_auk_edit.py test_auk_inference.py test_auk_handler.py
      - name: Free image build space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.auk-runpod
          push: true
          tags: ghcr.io/kademurdock/scenema-audio-runpod:auk-runpod-${{ github.sha }}
          cache-to: type=inline
          cache-from: type=registry,ref=ghcr.io/kademurdock/scenema-audio-runpod:auk-runpod-1fc157957c21ffbbabba3ea2cd3e89f26f2063a8
