name: build-ming
on:
  workflow_dispatch:
  push:
    branches: [claude/ming-20261115]
    paths: ['ming_*.py', 'test_ming_*.py', 'Dockerfile.ming', '.github/workflows/ming.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the CPU audio test tools and Ming's task code
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install "numpy>=1.26,<3" "soundfile>=0.12,<1" "packaging>=24"
          git clone -q https://github.com/inclusionAI/Ming-3.0-tts /tmp/ming-upstream
          git -C /tmp/ming-upstream checkout -q a39b80660bdc5a4394d5e1d41af6dbfd9c443a54
      - name: Contract and handler tests (no GPU), checked against Ming's own resolver
        run: MING_UPSTREAM=/tmp/ming-upstream python3 -m unittest -v test_ming_handler.py
      - name: Free image build space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile.ming
          push: true
          tags: ghcr.io/kademurdock/scenema-audio-runpod:ming-${{ github.sha }}
          cache-to: type=inline
      - name: Image digest
        run: echo "ming-${{ github.sha }} ${{ steps.build.outputs.digest }}"
