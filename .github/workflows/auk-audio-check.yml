name: AuK CPU audio dependency check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Exercise existing production image without GPU or model loading
        run: >-
          docker run --rm -v "$PWD/check_auk_audio.py:/app/check_auk_audio.py:ro"
          ghcr.io/kademurdock/scenema-audio-runpod:auk-runpod-b1782eb4d0ead81765fa737f96e01cc1673843b6
          python3 /app/check_auk_audio.py
