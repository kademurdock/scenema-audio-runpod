name: build-voice
# The "Sing it in my voice" worker image. Runs only for the voice-rvc branch (or by hand); the YuE2 and AuK images are untouched.
on:
  push:
    branches: [voice-rvc]
    paths: [Dockerfile.voice, 'voice/**', .github/workflows/voice.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU unit tests (no GPU, no bucket, no network)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q numpy==1.26.4
          cd voice && python -m unittest -v test_voice.py
      - name: Free disk for the CUDA wheels and the separation models
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.voice
          push: true
          # Pin the sha tag in the RunPod template; voice-rvc-latest only feeds the next build's layer cache.
          tags: |
            ghcr.io/kademurdock/scenema-audio-runpod:voice-rvc-${{ github.sha }}
            ghcr.io/kademurdock/scenema-audio-runpod:voice-rvc-latest
          cache-from: type=registry,ref=ghcr.io/kademurdock/scenema-audio-runpod:voice-rvc-latest
          cache-to: type=inline
      - name: Disk after the build
        if: always()
        run: df -h /
