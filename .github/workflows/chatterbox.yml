name: build-chatterbox
on:
  workflow_dispatch:
  push:
    branches: [claude/chatterbox-20261116]
    paths: ['chatterbox_*.py', 'test_chatterbox_*.py', 'Dockerfile.chatterbox', '.github/workflows/chatterbox.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the CPU audio test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install "numpy==1.26.4" "soundfile==0.13.1"
      - name: Contract and handler tests (no GPU)
        run: python3 -m unittest -v test_chatterbox_handler.py
      - name: Free image build space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile.chatterbox
          push: true
          tags: ghcr.io/kademurdock/scenema-audio-runpod:chatterbox-${{ github.sha }}
          cache-to: type=inline
      - name: Image digest
        run: echo "chatterbox-${{ github.sha }} ${{ steps.build.outputs.digest }}"
