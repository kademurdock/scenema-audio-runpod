name: build-voxcpm
on:
  workflow_dispatch:
  push:
    branches: [claude/voxcpm-20261115]
    paths: ['voxcpm_*.py', 'test_voxcpm_*.py', 'Dockerfile.voxcpm', '.github/workflows/voxcpm.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the CPU audio test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install "numpy>=1.26,<3" "soundfile>=0.12,<1"
      - name: Contract and handler tests (no GPU)
        run: python3 -m unittest -v test_voxcpm_handler.py
      - name: Free image build space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile.voxcpm
          push: true
          tags: ghcr.io/kademurdock/scenema-audio-runpod:voxcpm-${{ github.sha }}
          cache-to: type=inline
      - name: Image digest
        run: echo "voxcpm-${{ github.sha }} ${{ steps.build.outputs.digest }}"
