name: build-yue2
on:
  push:
    branches: [main, session202-yue2]
    paths: [Dockerfile.yue, yue_handler.py, test_yue_controls.py, cover.py, .github/workflows/yue.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sound controls without GPU charges
        run: python -m unittest test_yue_controls.py
      - name: Free disk for CUDA
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.yue
          push: true
          tags: ghcr.io/kademurdock/scenema-audio-runpod:yue2-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/kademurdock/scenema-audio-runpod:yue2-2bc4ab7a5b33158f102ef2041bf0648d480465ba
          cache-to: type=inline
